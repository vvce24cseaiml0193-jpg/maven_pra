name: Java CI and Docker Build Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Build Java Project and Run JUnit Tests
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run JUnit Tests & Package JAR
      run: mvn clean package

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar

  # Job 2: Build Docker Image and Push to Docker Hub
  docker-build-and-push:
    needs: build-and-test # Ensures Docker push only happens if tests pass
    if: github.event_name == 'push' # Only push on branch pushes (not PRs)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Download JAR Artifact
      uses: actions/download-artifact@v4
      with:
        name: app-jar
        path: target/

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: sahanawalave413
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: sahanawalave413/maaven:latest